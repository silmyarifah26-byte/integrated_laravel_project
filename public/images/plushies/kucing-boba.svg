<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="bgCat" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </radialGradient>
  </defs>
  <rect width="200" height="200" rx="30" fill="url(#bgCat)"/>
  <!-- Pointy Cat Ears -->
  <polygon points="60,80 72,40 92,68" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <polygon points="66,74 74,48 88,68" fill="#F472B6"/>
  <polygon points="140,80 128,40 108,68" fill="#F97316"/>
  <polygon points="134,74 126,48 112,68" fill="#FDBA74"/>
  <!-- Body -->
  <ellipse cx="100" cy="148" rx="44" ry="38" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="2"/>
  <!-- Calico Patch -->
  <path d="M125 125 C140 125 145 145 138 158 C130 152 120 148 125 125 Z" fill="#F97316"/>
  <!-- Head -->
  <circle cx="100" cy="98" r="44" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="2"/>
  <!-- Orange Head Patch -->
  <path d="M125 65 C138 72 144 88 138 102 C130 92 120 85 125 65 Z" fill="#F97316"/>
  <path d="M65 72 C58 82 58 95 65 105 C70 95 72 85 65 72 Z" fill="#64748B"/>
  <!-- Eyes -->
  <ellipse cx="82" cy="98" rx="5" ry="6" fill="#1E293B"/>
  <circle cx="84" cy="96" r="2" fill="#FFFFFF"/>
  <ellipse cx="118" cy="98" rx="5" ry="6" fill="#1E293B"/>
  <circle cx="120" cy="96" r="2" fill="#FFFFFF"/>
  <!-- Nose & Whiskers -->
  <polygon points="97,105 103,105 100,109" fill="#FB7185"/>
  <path d="M96 110 Q100 114 104 110" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round"/>
  <line x1="62" y1="102" x2="48" y2="100" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
  <line x1="62" y1="108" x2="48" y2="110" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
  <line x1="138" y1="102" x2="152" y2="100" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
  <line x1="138" y1="108" x2="152" y2="110" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
  <!-- Cheeks -->
  <ellipse cx="74" cy="108" rx="7" ry="4" fill="#F472B6" opacity="0.6"/>
  <ellipse cx="126" cy="108" rx="7" ry="4" fill="#F472B6" opacity="0.6"/>
  <!-- Boba Milk Tea Cup Hugged by Paws -->
  <g transform="translate(100, 146)">
    <!-- Cup -->
    <path d="M-15 -10 L-11 20 C-10 26 10 26 11 20 L15 -10 Z" fill="#FDE68A"/>
    <!-- Lid & Straw -->
    <ellipse cx="0" cy="-10" rx="16" ry="4" fill="#D97706"/>
    <rect x="2" y="-22" width="4" height="15" rx="2" fill="#EC4899" transform="rotate(15 4 -15)"/>
    <!-- Boba Pearls -->
    <circle cx="-5" cy="14" r="2.5" fill="#451A03"/>
    <circle cx="2" cy="16" r="2.5" fill="#451A03"/>
    <circle cx="7" cy="13" r="2.5" fill="#451A03"/>
    <!-- Cat Paws -->
    <circle cx="-16" cy="0" r="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="16" cy="0" r="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  </g>
</svg>
