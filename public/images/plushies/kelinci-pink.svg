<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="bgBunny" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF1F2"/>
      <stop offset="100%" stop-color="#FFE4E6"/>
    </radialGradient>
    <radialGradient id="pinkFur" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFF1F2"/>
      <stop offset="100%" stop-color="#FBCFE8"/>
    </radialGradient>
  </defs>
  <rect width="200" height="200" rx="30" fill="url(#bgBunny)"/>
  <!-- Floppy Bunny Ears -->
  <ellipse cx="65" cy="55" rx="14" ry="42" fill="url(#pinkFur)" transform="rotate(-15 65 55)"/>
  <ellipse cx="65" cy="55" rx="8" ry="30" fill="#F472B6" transform="rotate(-15 65 55)"/>
  <ellipse cx="135" cy="55" rx="14" ry="42" fill="url(#pinkFur)" transform="rotate(15 135 55)"/>
  <ellipse cx="135" cy="55" rx="8" ry="30" fill="#F472B6" transform="rotate(15 135 55)"/>
  <!-- Body -->
  <ellipse cx="100" cy="148" rx="42" ry="38" fill="url(#pinkFur)"/>
  <ellipse cx="100" cy="150" rx="26" ry="22" fill="#FFFFFF"/>
  <!-- Head -->
  <circle cx="100" cy="104" r="42" fill="url(#pinkFur)"/>
  <!-- Eyes -->
  <ellipse cx="82" cy="100" rx="5" ry="6" fill="#1E293B"/>
  <circle cx="84" cy="98" r="2" fill="#FFFFFF"/>
  <ellipse cx="118" cy="100" rx="5" ry="6" fill="#1E293B"/>
  <circle cx="120" cy="98" r="2" fill="#FFFFFF"/>
  <!-- Cute Bunny Nose & Mouth -->
  <polygon points="97,108 103,108 100,112" fill="#F43F5E"/>
  <path d="M96 113 Q100 117 104 113" stroke="#881337" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- Rosy Cheeks -->
  <ellipse cx="74" cy="110" rx="7" ry="4.5" fill="#FB7185" opacity="0.6"/>
  <ellipse cx="126" cy="110" rx="7" ry="4.5" fill="#FB7185" opacity="0.6"/>
  <!-- Strawberry Held in Paws -->
  <g transform="translate(100, 142)">
    <path d="M-8 -2 C-12 8 0 16 0 16 C0 16 12 8 8 -2 C6 -8 -6 -8 -8 -2 Z" fill="#EF4444"/>
    <ellipse cx="-4" cy="2" rx="0.8" ry="1.2" fill="#FEF08A"/>
    <ellipse cx="3" cy="4" rx="0.8" ry="1.2" fill="#FEF08A"/>
    <path d="M-5 -4 L0 -7 L5 -4 L0 -3 Z" fill="#22C55E"/>
    <!-- Paws -->
    <circle cx="-12" cy="2" r="6" fill="url(#pinkFur)"/>
    <circle cx="12" cy="2" r="6" fill="url(#pinkFur)"/>
  </g>
</svg>
